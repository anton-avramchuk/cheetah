services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-identity-api:
    build:
      context: .
      dockerfile: src/Modules/Identity/Crm.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: Host=postgres;Database=cheetah_identity;Username=postgres;Password=postgres
      Redis__Instances__default__ConnectionString: redis:6379
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-cheetah-crm}
      Jwt__Audience: ${JWT_AUDIENCE:-cheetah-crm-api}
      Jwt__ExpirationMinutes: "720"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crm-masterdata-api:
    build:
      context: .
      dockerfile: src/Modules/MasterData/Crm.MasterData.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MasterData: Host=postgres;Database=cheetah_masterdata;Username=postgres;Password=postgres
      Redis__Instances__default__ConnectionString: redis:6379
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-cheetah-crm}
      Jwt__Audience: ${JWT_AUDIENCE:-cheetah-crm-api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crm-proxy:
    build:
      context: .
      dockerfile: src/Modules/Crm.Proxy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Yarp__Clusters__identityCluster__Destinations__identityDestination__Address: http://crm-identity-api:8080/api
      Yarp__Clusters__masterdataCluster__Destinations__masterdataDestination__Address: http://crm-masterdata-api:8080
    ports:
      - "5555:8080"
    depends_on:
      - crm-identity-api
      - crm-masterdata-api


volumes:
  postgres_data:
