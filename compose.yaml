services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: cheetah-postgres
    environment:
      POSTGRES_USER: cheetah
      POSTGRES_PASSWORD: cheetah123
      POSTGRES_DB: cheetah_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cheetah-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheetah"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Web Admin for PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cheetah-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cheetah-network
    depends_on:
      - postgres

  # Redis - In-Memory Data Store & Event Bus
  redis:
    image: redis:7-alpine
    container_name: cheetah-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - cheetah-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RedisInsight - Web Admin for Redis
  redisinsight:
    image: redis/redisinsight:latest
    container_name: cheetah-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - cheetah-network
    depends_on:
      - redis

  # Cheetah CRM API
  api:
    image: cheetah.crm
    container_name: cheetah-api
    build:
      context: .
      dockerfile: src/Cheetah.Crm/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Master: "Host=postgres;Port=5432;Database=cheetah_master;Username=cheetah;Password=cheetah123"
      ConnectionStrings__Tenants: "Host=postgres;Port=5432;Database=cheetah_tenants;Username=cheetah;Password=cheetah123"
      ConnectionStrings__TenantTemplate: "Host=postgres;Port=5432;Database=database;Username=cheetah;Password=cheetah123"
      Redis__Instances__Default__ConnectionString: "redis:6379"
      Redis__Instances__Default__Database: "0"
    networks:
      - cheetah-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Cheetah Blazor Web App
  web:
    image: cheetah.web
    container_name: cheetah-web
    build:
      context: .
      dockerfile: src/Cheetah.Crm.Web.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: http://api:8080
    networks:
      - cheetah-network
    depends_on:
      - api

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cheetah-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cheetah-network
    depends_on:
      - api
      - web

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local

networks:
  cheetah-network:
    driver: bridge

