# Публикация NuGet-пакетов Cheetah.* в GitHub Packages.
# Запускается ТОЛЬКО при пуше тега вида v1.0.23 И только если тег указывает
# на коммит из ветки dev (теги с других веток публикацию не запускают).
# Версия пакета берётся ИЗ ТЕГА: v1.0.23 -> 1.0.23 (override version.props
# через /p:CheetahVersion).

name: Publish NuGet (GitHub Packages)

on:
  push:
    tags: [ "v*" ]

jobs:
  # Страж: тег сам по себе не привязан к ветке, поэтому проверяем, что помеченный
  # коммит входит в origin/dev. Если нет — публикация пропускается.
  guard:
    runs-on: ubuntu-latest
    outputs:
      on_dev: ${{ steps.check.outputs.on_dev }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # нужна полная история и ветки, чтобы проверить принадлежность тега

      - name: Verify tag is on dev
        id: check
        run: |
          if git branch -r --contains "${{ github.sha }}" | grep -qE 'origin/dev$'; then
            echo "on_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Тег не указывает на коммит из ветки dev — публикация пропущена."
            echo "on_dev=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.on_dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # нужно для пуша в GitHub Packages через GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Версия = имя тега без префикса v (v1.0.23 -> 1.0.23).
      - name: Derive version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then echo "Пустая версия из тега $GITHUB_REF_NAME"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Публикуемая версия: $version"

      - name: Restore dependencies
        run: dotnet restore

      # Билдим и пакуем как в pack.ps1: и build, и pack получают одну версию через
      # /p:CheetahVersion, чтобы AssemblyVersion в dll совпадала с версией пакета.
      - name: Build
        run: dotnet build Cheetah.slnx --configuration Release --no-restore /p:CheetahVersion=${{ steps.ver.outputs.version }}

      - name: Pack
        run: dotnet pack Cheetah.slnx --configuration Release --no-restore --output artifacts /p:CheetahVersion=${{ steps.ver.outputs.version }}

      # Пушим все собранные Cheetah.*-пакеты. --skip-duplicate: повторный запуск на той же
      # версии не падает, а просто пропускает уже опубликованные пакеты.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/Cheetah.*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
